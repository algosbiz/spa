name: Purge Cloudflare cache

# Cloudflare caches pages for two hours, so a deploy is invisible to visitors
# until its cache is dropped -- that is how a corrected phone number kept being
# served after the fix was already live.
#
# This runs on deployment_status rather than on push because the purge has to
# happen AFTER the new build is serving. Purging while Vercel is still building
# just refills Cloudflare from the old origin, which is worse than not purging
# at all. Vercel reports the deployment to GitHub when it goes live, and that
# report is what triggers this.
on:
  deployment_status:
  # So the cache can also be dropped by hand from the Actions tab.
  workflow_dispatch:

jobs:
  purge:
    # deployment_status fires for previews and for every intermediate state.
    # Only a production deployment that actually succeeded serves the live
    # domain. (String comparison in GitHub expressions is case-insensitive, so
    # this matches Vercel's "Production" too.) workflow_dispatch carries no
    # deployment payload, hence the event-name branch.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment.environment == 'production')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The script imports only node:fs and node:path and uses global fetch, so
      # there is nothing to install -- no npm ci step on purpose.
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # purge-cloudflare.mjs exits 0 when the credentials are absent, so that a
      # pipeline without them still goes green. That is the wrong behaviour once
      # the purge is something we rely on: the first run of this workflow passed
      # while silently purging nothing, and the stale page went unnoticed. Fail
      # here instead, before the script gets a chance to shrug.
      # TEMPORARY: six runs reported both credentials empty while the names
      # were demonstrably right in the UI, so ask the runner what it can
      # actually see. GitHub masks secret values in logs, so this prints names
      # only. Remove once the cause is known.
      - name: Report which secrets this job can see
        env:
          ALL_SECRETS: ${{ toJSON(secrets) }}
        run: |
          names=$(node -e "console.log(Object.keys(JSON.parse(process.env.ALL_SECRETS)).join(', ') || '(none)')")
          echo "::error::Secrets visible to this job: $names"

      - name: Check the credentials are present
        env:
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          missing=
          [ -n "$CLOUDFLARE_ZONE_ID" ] || missing="$missing CLOUDFLARE_ZONE_ID"
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          if [ -n "$missing" ]; then
            echo "::error::Missing secret(s):$missing"
            echo "This job reads repository secrets and Production environment"
            echo "secrets, so neither placement explains an empty value. Check"
            echo "Settings > Secrets and variables > Actions on algosbiz/spa and"
            echo "confirm the names match exactly -- and that they were added to"
            echo "this repository rather than another one."
            exit 1
          fi
          echo "Both credentials are present."

      - name: Purge the zone
        run: node scripts/purge-cloudflare.mjs
        env:
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # A purge that returns success but leaves the edge serving the old copy is
      # the failure this workflow exists to catch, so prove the cache is cold
      # rather than trusting the API's word for it.
      - name: Confirm the edge is cold
        env:
          # Same source the purge script reads, so the check and the purge
          # can never end up pointed at two different sites.
          SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'https://spabalimoon.com' }}
        run: |
          sleep 5
          age=$(curl -sI "$SITE_URL/" | tr -d '\r' \
                | awk 'tolower($1)=="age:"{print $2}')
          echo "Age after purge: ${age:-<none>}"
          if [ -n "$age" ] && [ "$age" -gt 60 ]; then
            echo "::error::Cloudflare still served a ${age}s-old copy, so the purge did not take effect."
            exit 1
          fi
